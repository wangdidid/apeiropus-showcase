/* Self-theming favicon. DARK is the baseline (this is a dark-themed app and the
   path fill="" fallbacks are the dark design too), so any engine that can't
   evaluate the media query still gets the dark badge. We only switch to the
   light design when the browser explicitly asks for a light scheme. */
.o-field{fill:#322e3f}
.o-mark{fill:#fefefe}
@media (prefers-color-scheme: light){
  .o-field{fill:#f8f4ed}
  .o-mark{fill:#322e3f}
}
</style>
